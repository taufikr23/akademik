spring:
  cloud:
    gateway:
      routes:
        - id: backend-service
          uri: http://academic-service:8081
          predicates:
            - Path=/api/v1/academic-years/**,/api/v1/classes/**,/api/v1/departments/**,/api/v1/semesters/**,/api/v1/subjects/**,/api/v1/teachers/**,/api/v1/teacher-subjects/**,/api/v1/homeroom-teachers/**
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/v1/auth/**
        - id: student-service
          uri: http://student-service:8083
          predicates:
            - Path=/api/v1/students/**,/api/v1/enrollments/**
        - id: schedule-service
          uri: http://schedule-service:8084
          predicates:
            - Path=/api/v1/schedules/**,/api/v1/events/**
        - id: attendance-service
          uri: http://attendance-service:8085
          predicates:
            - Path=/api/v1/attendance/**
        - id: assignment-service
          uri: http://assignment-service:8086
          predicates:
            - Path=/api/v1/assignment/**
        - id: grade-service
          uri: http://grade-service:8087
          predicates:
            - Path=/api/v1/grade/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
