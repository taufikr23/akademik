services:
  - type: web
    name: siasek-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TIDB_JDBC_URL
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
