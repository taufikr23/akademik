server.port=${PORT:10000}
spring.datasource.url=${TIDB_JDBC_URL}
spring.datasource.username=${TIDB_USER}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.show-sql=false
logging.level.com.taufik.auth=INFO
spring.sql.init.schema-locations=classpath:schema-files.sql
siasek.database-uploads=true
app.student-service.url=http://127.0.0.1:${server.port}
app.teacher-service.url=http://127.0.0.1:${server.port}
