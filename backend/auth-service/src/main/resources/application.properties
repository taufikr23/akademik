spring.application.name=auth-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/akademik_db?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 🔐 JWT Configuration - KEY HARUS MINIMAL 64 KARAKTER!
jwt.secret=SIASEKSuperSecretKeyForJWTWith512BitsLengthMinimumRequirementForHS512Algorithm
jwt.expiration=86400000
logging.level.com.taufik.auth=DEBUG

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# 📧 SMTP Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 🌐 Frontend URL for activation links
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:SIASEK <noreply@siasek.com>}

# 🔗 Service URLs for inter-service communication
app.student-service.url=${STUDENT_SERVICE_URL:http://localhost:8083}
app.teacher-service.url=${TEACHER_SERVICE_URL:http://localhost:8081}